name: Supabase Keep Alive

on:
  schedule:
    # Roda todos os dias às 10:00 da manhã (UTC)
    - cron: '0 10 * * *'
  workflow_dispatch: # Permite rodar manualmente pelo painel do GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://qpxxzzvozrnfmjcygujv.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFweHh6enZvenJuZm1qY3lndWp2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYzNzk1MzgsImV4cCI6MjEwMTk1NTUzOH0.Ro8xv6_5jIlMMBgKlXKqYOcZG5W980gRXFjWz2YZY_Q' }}
        run: |
          echo "Pinging Supabase to prevent pause..."
          curl -s -X GET "${SUPABASE_URL}/rest/v1/funcionarios?select=id&limit=1" \
          -H "apikey: ${SUPABASE_ANON_KEY}" \
          -H "Authorization: Bearer ${SUPABASE_ANON_KEY}"
          echo -e "\nPing concluded."
